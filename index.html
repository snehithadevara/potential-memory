<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Weather App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a56 0%, #ff6b6b 50%, #ffd93d 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      background: linear-gradient(180deg, rgba(255, 200, 100, 0.95) 0%, rgba(255, 180, 80, 0.95) 100%);
      padding: 30px;
      border-radius: 40px;
      display: inline-block;
      min-width: 320px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      color: #fff;
      text-align: center;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 0 10px;
    }

    .header-title {
      font-size: 14px;
      font-weight: 600;
      opacity: 0.9;
    }

    input {
      padding: 12px 15px;
      width: 100%;
      border: none;
      border-radius: 25px;
      margin-bottom: 15px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.3);
      color: #fff;
      text-align: center;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    button {
      padding: 12px 30px;
      border: none;
      background: rgba(255, 255, 255, 0.4);
      color: #fff;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      margin-bottom: 20px;
      transition: all 0.3s ease;
      font-size: 14px;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.6);
      transform: translateY(-2px);
    }

    .weather {
      margin-top: 20px;
    }

    .temp-section {
      font-size: 72px;
      font-weight: bold;
      margin: 20px 0;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    }

    .city-info {
      font-size: 18px;
      margin-bottom: 15px;
      opacity: 0.95;
    }

    .description {
      font-size: 16px;
      margin-bottom: 20px;
      opacity: 0.9;
      font-weight: 500;
    }

    .weather-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 20px;
    }

    .detail-item {
      background: rgba(255, 255, 255, 0.2);
      padding: 15px;
      border-radius: 15px;
      font-size: 13px;
    }

    .detail-label {
      opacity: 0.8;
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .detail-value {
      font-size: 18px;
      font-weight: bold;
    }

    .weather-icon {
      font-size: 48px;
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <div class="app">
    <div class="header">
      <div class="header-title">☀️ Weather</div>
      <div class="header-title">Refresh ↻</div>
    </div>
    
    <input type="text" id="city" placeholder="Enter city name">
    <button onclick="getWeather()">Get Weather</button>

    <div class="weather" id="weather">
      <div style="opacity: 0.8;">Enter a city name and click Get Weather</div>
    </div>
  </div>

  <script>
    function getWeatherEmoji(main) {
      switch(main.toLowerCase()) {
        case 'sunny':
        case 'clear':
          return '☀️';
        case 'clouds':
        case 'cloudy':
          return '☁️';
        case 'rain':
        case 'rainy':
          return '🌧️';
        case 'drizzle':
          return '🌦️';
        case 'thunderstorm':
          return '⛈️';
        case 'snow':
          return '❄️';
        default:
          return '🌤️';
      }
    }

    async function getWeather() {
      const city = document.getElementById("city").value;
      const weatherDiv = document.getElementById("weather");

      if (!city) {
        weatherDiv.innerHTML = "Please enter a city name.";
        return;
      }

      weatherDiv.innerHTML = "<div style='opacity: 0.8;'>Loading...</div>";

      try {
        // Use Open-Meteo free API (no authentication needed)
        const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;
        
        const geoRes = await fetch(geoUrl);
        const geoData = await geoRes.json();

        if (!geoData.results || geoData.results.length === 0) {
          throw new Error("City not found");
        }

        const location = geoData.results[0];
        const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${location.latitude}&longitude=${location.longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,pressure_msl,apparent_temperature&temperature_unit=celsius&wind_speed_unit=ms&timezone=auto`;

        const weatherRes = await fetch(weatherUrl);
        const weatherData = await weatherRes.json();
        const current = weatherData.current;

        const weatherDescriptions = {
          0: "Clear sky",
          1: "Mainly clear",
          2: "Partly cloudy",
          3: "Overcast",
          45: "Foggy",
          48: "Foggy",
          51: "Drizzle",
          53: "Drizzle",
          55: "Drizzle",
          61: "Rain",
          63: "Rain",
          65: "Rain",
          71: "Snow",
          73: "Snow",
          75: "Snow",
          77: "Snow",
          80: "Rain",
          81: "Rain",
          82: "Rain",
          85: "Snow",
          86: "Snow",
          95: "Thunderstorm",
          96: "Thunderstorm",
          99: "Thunderstorm"
        };

        const description = weatherDescriptions[current.weather_code] || "Unknown";
        const emoji = getWeatherEmoji(description);
        const feelsLike = Math.round(current.apparent_temperature);
        const country = location.country || "";

        weatherDiv.innerHTML = `
          <div class="city-info">${location.name}, ${country}</div>
          <div class="weather-icon">${emoji}</div>
          <div class="temp-section">${Math.round(current.temperature_2m)}°</div>
          <div class="description">${description}</div>
          
          <div class="weather-details">
            <div class="detail-item">
              <div class="detail-label">Feels Like</div>
              <div class="detail-value">${feelsLike}°</div>
            </div>
            <div class="detail-item">
              <div class="detail-label">Humidity</div>
              <div class="detail-value">${current.relative_humidity_2m}%</div>
            </div>
            <div class="detail-item">
              <div class="detail-label">Pressure</div>
              <div class="detail-value">${Math.round(current.pressure_msl)} mb</div>
            </div>
            <div class="detail-item">
              <div class="detail-label">Wind Speed</div>
              <div class="detail-value">${current.wind_speed_10m.toFixed(1)} m/s</div>
            </div>
          </div>
        `;
      } catch (error) {
        console.error("Weather fetch error:", error);
        weatherDiv.innerHTML = `<div style='color: rgba(255,255,255,0.8);'>❌ ${error.message}<br><small>Try another city name</small></div>`;
      }
    }
  </script>

</body>
</html>
